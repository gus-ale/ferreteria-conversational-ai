services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+asyncmy://ferrebot:ferrebot-change-me@mysql:3306/ferreteria_conversational
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ferreteria_conversational
      MYSQL_USER: ferrebot
      MYSQL_PASSWORD: ferrebot-change-me
      MYSQL_ROOT_PASSWORD: root-change-me
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
